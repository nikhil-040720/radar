const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const KEY="radar-key-v1";
async function derive(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:ub(P.salt),iterations:P.iter},base,512))}
async function open(bits){const salt=ub(P.salt),iv=ub(P.iv),ct=ub(P.ct),tag=ub(P.tag);
  const mk=await crypto.subtle.importKey("raw",bits.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  const msg=new Uint8Array(salt.length+iv.length+ct.length);msg.set(salt);msg.set(iv,salt.length);msg.set(ct,salt.length+iv.length);
  if(!await crypto.subtle.verify("HMAC",mk,tag,msg))return null;
  const ek=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CTR",false,["decrypt"]);
  const z=await crypto.subtle.decrypt({name:"AES-CTR",counter:iv,length:64},ek,ct);
  const html=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
  return html}
function show(html){ // full-screen same-origin frame: dashboard scripts, search and saved watchlist all work
  const f=document.createElement("iframe");f.setAttribute("title","Results Radar dashboard");
  f.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff";
  document.body.innerHTML="";document.body.style.cssText="margin:0;background:#fff";document.body.appendChild(f);
  f.addEventListener("load",()=>{try{document.title=f.contentDocument.title||document.title;
    // in-page links (#stocks, #scorecard…) must switch tabs inside the dashboard, not reload this lock page
    f.contentDocument.addEventListener("click",e=>{const l=e.target.closest&&e.target.closest('a[href^="#"]');
      if(!l)return;e.preventDefault();f.contentWindow.location.hash=l.getAttribute("href")},true)}catch(e){}});
  f.srcdoc=html}
async function tryStored(){let s=null;try{s=localStorage.getItem(KEY+":"+P.salt)||localStorage.getItem(KEY)}catch(e){}
  if(!s)return false;try{const j=JSON.parse(s);if(j.salt!==P.salt)return false;const h=await open(ub(j.bits));if(h){show(h);return true}}catch(e){}return false}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("go"),er=document.getElementById("err");
  b.disabled=true;b.textContent="Unlocking…";er.textContent="";
  try{const bits=await derive(document.getElementById("pw").value);const h=await open(bits);
    if(!h){er.textContent="Wrong password.";b.disabled=false;b.textContent="Open dashboard";return}
    if(document.getElementById("rem").checked){try{localStorage.setItem(KEY,JSON.stringify({salt:P.salt,bits:b64(bits)}))}catch(e){}}
    show(h)}catch(x){er.textContent="This browser can't open the page ("+x.message+"). Try Chrome, Edge or Safari.";b.disabled=false;b.textContent="Open dashboard"}});
tryStored();
})();
